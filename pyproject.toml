[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pricescope"
version = "0.1.0"
description = "Платформа сбора, хранения и сравнения цен товаров"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "PriceScope" }]
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<1",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "sqlalchemy[asyncio]>=2.0,<3",  # greenlet нужен для AsyncSession
    "aiosqlite>=0.20,<1",
    "alembic>=1.13,<2",
    "structlog>=24.1,<27",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=5,<8",
    "ruff>=0.5,<1",
    "mypy>=1.10,<3",
    "pre-commit>=3.7,<5",
]
parser5ka = [
    "camoufox>=0.15",
    "human-requests>=0.4",
    "pillow>=10",
    "pandas>=2.1",
]
ml = [
    "numpy>=1.26,<3",
    "sentence-transformers>=3,<7",
]

[project.scripts]
pricescope = "pricescope_api.cli:main"

[tool.setuptools.packages.find]
where = ["packages/core", "packages/parsers", "packages/ml", "apps/api", "apps/viewer"]
include = ["pricescope_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy", "apps/mobile", "lenta_parser*.py", "test_item_736811.py", "photos", "apps/api/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
plugins = []
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
files = ["packages", "apps/api", "apps/viewer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages", "apps/api/tests"]
markers = [
    "live: требует реального доступа к сети (не запускается в CI)",
]
filterwarnings = ["ignore::DeprecationWarning"]
