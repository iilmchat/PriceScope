<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or 'PriceScope' }}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx-lite.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">PriceScope <span>v0.1</span></a>
    <nav>
      <a href="/" class="{% if active == 'overview' %}active{% endif %}">Обзор</a>
      <a href="/products" class="{% if active == 'products' %}active{% endif %}">Товары</a>
      <a href="/compare" class="{% if active == 'compare' %}active{% endif %}">Сравнение</a>
      <a href="/imports" class="{% if active == 'imports' %}active{% endif %}">Импорты</a>
      <a href="/matches" class="{% if active == 'matches' %}active{% endif %}">Совпадения</a>
      <a href="/settings" class="{% if active == 'settings' %}active{% endif %}">Настройки</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>© 2026 PriceScope · локальный режим · данные остаются на этом компьютере</footer>
</body>
</html>
