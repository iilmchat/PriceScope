plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

android {
    namespace 'com.example.pricescope_mobile'
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId 'com.example.pricescope_mobile'
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            // v0.1: подпись debug; подпись для Google Play — v0.2
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}
