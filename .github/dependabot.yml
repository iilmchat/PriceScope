version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  # Flutter в CI зафиксирован на 3.24.5 (Dart 3.5.4). Новые majors pub-пакетов
  # требуют более свежий SDK и автоматически ломают CI — обновляем вручную.
  - package-ecosystem: pub
    directory: "/apps/mobile"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
