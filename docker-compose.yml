services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8775:8775"
    environment:
      PRICESCOPE_MODE: local
      PRICESCOPE_DB_PATH: /app/data/pricescope.db
      PRICESCOPE_HOST: 0.0.0.0
      PRICESCOPE_PORT: "8775"
    volumes:
      - ./data:/app/data
      - ./datasets:/app/datasets

